spring.application.name=electric-bug-marker-lambda
server.port=8085

# ---- data source toggle ----
# false (default) = read orders/laybys from Postgres (RDS, kept in sync by retailsync-api)
# true            = read orders/laybys live from the AAAPOS REST API instead
externalApiFlag=false

# ---- AAAPOS API (used when externalApiFlag=true) ----
aaapos.api.base-url=${AAAPOS_BASE_URL:https://example-aaapos-host/api}
aaapos.api.key=${AAAPOS_API_KEY:}

markers.table.name=${MARKERS_TABLE_NAME:job_installation_markers}

spring.main.lazy-initialization=true